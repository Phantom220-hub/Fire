name: Last Campfire LAN Beta APK (fixed source)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lan-beta-build.yml'
      - 'LastCampfire_LAN_beta_fixed_source.zip'
      - '.github/lan/patch_multiplayer.py'
      - '.github/lan/LanPlugin.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lan-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract fixed LAN beta source only
        run: |
          test -f LastCampfire_LAN_beta_fixed_source.zip
          mkdir -p src
          unzip -q LastCampfire_LAN_beta_fixed_source.zip -d src
          PKG=$(find src -name package.json -type f -print -quit)
          test -n "$PKG"
          APP_DIR=$(dirname "$PKG")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          test -f "$APP_DIR/capacitor.config.json"
          test -d "$APP_DIR/www"
          python3 .github/lan/patch_multiplayer.py "$APP_DIR"
      - name: Install JS dependencies
        run: |
          cd "$APP_DIR"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Prepare Android project
        run: |
          cd "$APP_DIR"
          if [ ! -d android ]; then npx cap add android; fi
          if [ -f tools/patch_android.py ]; then python3 tools/patch_android.py; fi
          npx cap sync android
      - name: Install audited LAN plugin and network permissions
        run: |
          JAVA_DIR="$APP_DIR/android/app/src/main/java/com/nyxvault/lastcampfire"
          mkdir -p "$JAVA_DIR"
          cp .github/lan/LanPlugin.java "$JAVA_DIR/LanPlugin.java"
          python3 - "$APP_DIR/android/app/src/main/AndroidManifest.xml" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          permissions = (
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.CHANGE_NETWORK_STATE",
          )
          start = text.find("<manifest")
          end = text.find(">", start) if start >= 0 else -1
          if start < 0 or end < 0:
              raise SystemExit("AndroidManifest.xml has no manifest root element")
          insertion = ""
          for permission in permissions:
              if 'android:name="' + permission + '"' not in text:
                  insertion += chr(10) + '    <uses-permission android:name="' + permission + '" />'
          if insertion:
              text = text[:end + 1] + insertion + text[end + 1:]
              path.write_text(text, encoding="utf-8")
          print("LAN plugin installed; required network permissions verified.")
          PY
          grep -n 'uses-permission' "$APP_DIR/android/app/src/main/AndroidManifest.xml"
          grep -n 'ConnectivityManager.NetworkCallback\|unregisterNetworkCallback' "$JAVA_DIR/LanPlugin.java"
      - name: Build APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify and upload fixed LAN beta APK
        uses: actions/upload-artifact@v4
        with:
          name: LastCampfire-LAN-Beta-Fixed-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
