name: Last Campfire LAN Beta APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lan-beta-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lan-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract LAN beta source only
        run: |
          test -f LastCampfire_LAN_beta_source.zip
          mkdir -p src
          unzip -q LastCampfire_LAN_beta_source.zip -d src
          PKG=$(find src -name package.json -type f -print -quit)
          test -n "$PKG"
          APP_DIR=$(dirname "$PKG")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          test -f "$APP_DIR/capacitor.config.json"
          test -d "$APP_DIR/www"
      - name: Install JS dependencies
        run: |
          cd "$APP_DIR"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Prepare Android project
        run: |
          cd "$APP_DIR"
          if [ ! -d android ]; then npx cap add android; fi
          if [ -f tools/patch_android.py ]; then python3 tools/patch_android.py; fi
          npx cap sync android
      - name: Build APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify and upload LAN beta APK
        uses: actions/upload-artifact@v4
        with:
          name: LastCampfire-LAN-Beta-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
